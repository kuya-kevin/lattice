[project]
name = "j-evals-yourmt3"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
# YourMT3+ (Apache-2.0, code + checkpoints from the HF space mimbres/YourMT3, downloaded to
# <bigdisk>/repos/YourMT3). numpy/transformers pins follow the space.
dependencies = [
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "numpy==1.26.4",
    "transformers==4.45.1",
    "lightning>=2.2.1",
    "einops",
    "mido",
    "mir_eval",
    "librosa",
    "deprecated",
    "soundfile",
    "pretty_midi",
    "smart-open",
    "matplotlib",
    "wandb",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }
