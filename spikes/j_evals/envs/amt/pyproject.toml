[project]
name = "j-evals-amt"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
# DSP only (no model weights): pyin and onsets (librosa), mir_eval (MIT) for scoring;
# plus the synthetic phone-degraded set builder.
dependencies = [
    "mir_eval",
    "pretty_midi",
    "librosa",
    "soundfile",
    "scipy",
    "av",
    "tinysoundfont",
    "pyloudnorm",
]

[tool.uv]
override-dependencies = ["pyaudio; sys_platform == 'never'"]  # pyaudio: tinysoundfont playback only
